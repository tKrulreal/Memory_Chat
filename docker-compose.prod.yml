# ============================================================
# Production Docker Compose Override
# ============================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Backend - Production
  # ============================================================
  backend:
    image: ghcr.io/ai20k-build-phase-cohort-3/p-214/backend:latest
    pull_policy: always
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${PRODUCTION_DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/readiness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # Frontend - Production
  # ============================================================
  frontend:
    image: ghcr.io/ai20k-build-phase-cohort-3/p-214/frontend:latest
    pull_policy: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always

  # ============================================================
  # PostgreSQL - Production (use managed DB in production)
  # ============================================================
  postgres:
    # For production, use a managed database service instead
    # This is kept for development reference only
    profiles:
      - skip
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-memorychat}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped

# ============================================================
# Volumes (Production)
# ============================================================
volumes:
  pgdata_prod:
    driver: local
